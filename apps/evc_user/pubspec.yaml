name: evc_user
description: EcoVolt Charge - User App for requesting on-demand EV charging
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter

  # State Management - Provider
  provider: ^6.1.2

  # Serverpod Client
  evc_client:
    path: ../../evc_client
  # Serverpod Shared
  evc_shared:
    path: ../../evc_shared
  serverpod_flutter: ^3.4.3
  serverpod_auth_shared_flutter: ^3.4.3

  # Maps & Location
  mapbox_maps_flutter: ^2.4.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # UI & Design
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.16
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2

  # Utilities
  intl: ^0.20.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.3

  # Networking
  connectivity_plus: ^6.1.1
  gap: ^3.0.1
  flutter_screenutil: ^5.9.3
  smooth_page_indicator: ^2.0.1
  equatable: ^2.0.8
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  bot_toast: ^4.1.3
  flutter_toastr: ^1.0.3
  fluttertoast: ^9.0.0
  delightful_toast: ^1.1.0
  pinput: ^6.0.2
  riverpod: ^3.2.1
  hidden_drawer_menu: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # Assets will be added later
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # Custom fonts will be added later
  fonts:
    - family: TitilliumWeb
      fonts:
        - asset: assets/fonts/TitilliumWeb-Light.ttf
          weight: 300
        - asset: assets/fonts/TitilliumWeb-LightItalic.ttf
          weight: 700
        - asset: assets/fonts/TitilliumWeb-Bold.ttf
          weight: 700
        - asset: assets/fonts/TitilliumWeb-SemiBold.ttf
          weight: 700
        - asset: assets/fonts/TitilliumWeb-SemiBoldItalic.ttf
          weight: 700
        - asset: assets/fonts/TitilliumWeb-BoldItalic.ttf
          weight: 700
        - asset: assets/fonts/TitilliumWeb-Black.ttf
          weight: 700
        - asset: assets/fonts/TitilliumWeb-ExtraLight.ttf
          weight: 700
        - asset: assets/fonts/TitilliumWeb-ExtraLightItalic.ttf
          weight: 700
        - asset: assets/fonts/TitilliumWeb-Italic.ttf
          weight: 700
        - asset: assets/fonts/TitilliumWeb-Regular.ttf
          weight: 700
